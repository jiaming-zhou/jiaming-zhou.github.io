<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="googlebot" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=https://robbyant-research.github.io/Zero-WAM/">
    <link rel="canonical" href="https://robbyant-research.github.io/Zero-WAM/">
    <title>Zero-WAM has moved</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #181818;
            --paper: #faf8f2;
            --muted: #5f5c56;
            --line: rgba(24, 24, 24, 0.16);
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            background: var(--paper);
            color: var(--ink);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        main {
            width: min(40rem, calc(100% - 2rem));
            border-top: 2px solid var(--ink);
            border-bottom: 1px solid var(--line);
            padding: 2rem 0;
        }

        h1 {
            margin: 0 0 0.85rem;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.2rem, 8vw, 4.25rem);
            font-weight: 500;
            letter-spacing: 0;
            line-height: 0.95;
        }

        p {
            max-width: 34rem;
            margin: 0 0 1.25rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.55;
        }

        a {
            color: var(--ink);
            font-weight: 700;
            text-underline-offset: 0.18em;
        }
    </style>
    <script>
        window.location.replace("https://robbyant-research.github.io/Zero-WAM/");
    </script>
</head>

<body>
    <main>
        <h1>Zero-WAM has moved.</h1>
        <p>
            The project page is now maintained by RobbyAnt. Redirecting to the official Zero-WAM page.
        </p>
        <a href="https://robbyant-research.github.io/Zero-WAM/">Open the official page</a>
    </main>
</body>

</html>
